# .github/workflows/main.yml
# 工作流：自動抓取新聞、AI分析、讀取Firebase評分，並推送結果回GitHub
# 觸發：每天台灣時間 16:00 或 手動觸發
# 版本：使用 git 指令替代 git-auto-commit-action

name: News Analysis Workflow

on:
  schedule:
    - cron: '0 8 * * *' # 每天 8:00 UTC (台灣時間 16:00)
  workflow_dispatch:

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要寫入權限才能推送

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 opencc-python-reimplemented
          pip install google-generativeai openai
          pip install firebase-admin

      - name: Run News Fetcher (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news_gemini.py

      - name: Run News Fetcher (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_news_rss.py

      - name: Run Rating Analyzer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p data
          python scripts/analyze_ratings.py \
            --out data/ratings_export.csv \
            --raw_json data/ratings_raw.json \
            --analyzed_json data/ratings_analyzed.json

      # === START: 使用 git 指令提交 ===
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add data files
        run: git add data/*.* # 將 data/ 下的所有檔案加入暫存區

      - name: Commit changes
        run: |
          # 檢查是否有檔案變更，如果有才 commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自動更新新聞與評分數據 (Gemini + OpenAI)"
          else
            echo "No changes to commit in data/ folder."
          fi

      - name: Push changes
        run: |
          # 檢查是否有 commit 需要 push
          if git log -1 --pretty=%B | grep -q "chore: 自動更新新聞與評分數據"; then
            git push
          else
            echo "No commits to push."
          fi
      # === END: 使用 git 指令提交 ===
