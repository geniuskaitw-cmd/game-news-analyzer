# .github/workflows/main.yml
# 此工作流：
# 1. 每天定時 (台灣時間 16:00) 執行。
# 2. 安裝 Python 依賴。
# 3. [Gemini] 執行 Gemini 腳本，輸出 news_gemini.json
# 4. [OpenAI] 執行 OpenAI 腳本，輸出 news_ai.json
# 5. [分析] 執行分析腳本，從 Firebase 拉取使用者評分。
# 6. 將所有 data/ 檔案推送回 GitHub。

name: News Analysis Workflow

on:
  # 1. 定時觸發：每天 8:00 UTC (即台灣時間 16:00)
  schedule:
    - cron: '0 8 * * *'
  
  # 2. 允許手動觸發
  workflow_dispatch:

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 步驟 3: 安裝所有必要的 Python 函式庫
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 opencc-python-reimplemented
          pip install google-generativeai openai # 同時安裝 Gemini 和 OpenAI
          pip install firebase-admin # 用於 analyze_ratings.py

      # 步驟 4.1: 執行 Gemini 新聞抓取腳本
      - name: Run News Fetcher (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news_gemini.py

      # 步驟 4.2: 執行 OpenAI (RSS) 新聞抓取腳本
      - name: Run News Fetcher (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/fetch_news_rss.py

      # 步驟 5: 執行評分分析腳本 (從 Firebase 讀取)
      - name: Run Rating Analyzer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p data
          python scripts/analyze_ratings.py \
            --out data/ratings_export.csv \
            --raw_json data/ratings_raw.json \
            --analyzed_json data/ratings_analyzed.json

      # 步驟 6: 將所有變更 (data/ 資料夾中的 JSON/CSV) 推送回 GitHub
      - name: Commit and Push Data
        uses: stefanzweiger/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自動更新新聞與評分數據 (Gemini + OpenAI)"
          file_pattern: "data/*.*"
